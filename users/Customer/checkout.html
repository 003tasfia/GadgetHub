<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetHub | Checkout</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="customer.css">
</head>

<body data-page="cart">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark"><img src="assets/favicon.ico"
                        alt="GadgetHub icon"></span><span><span class="brand-name">GadgetHub</span><br><span
                        class="brand-tagline">SMARTER SHOPPING</span></span></a>
            <p class="nav-caption">CUSTOMER</p>
            <nav class="side-nav"><a class="nav-link" data-nav="overview" href="index.html">Overview</a><a
                    class="nav-link" data-nav="products" href="products.html">Browse products</a><a class="nav-link"
                    data-nav="cart" href="cart.html">My cart <span class="cart-count"></span></a><a class="nav-link"
                    data-nav="orders" href="orders.html">Order history</a><a class="nav-link" data-nav="status"
                    href="order-status.html">Order status</a><a class="nav-link" data-nav="profile"
                    href="profile.html">Manage profile</a><a class="nav-link" data-nav="support"
                    href="support.html">Support</a></nav>
            <div class="account-card"><span class="avatar">N</span><span><strong
                        data-user-name>Name</strong><span>Customer</span></span></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <h1 class="page-title">Checkout</h1>
                    <p class="page-subtitle">Complete your order securely.</p>
                </div>
            </header>
            <div class="content">
                <div class="checkout-layout">
                    <div>
                        <section>
                            <h2>Delivery information</h2>
                            <p class="page-subtitle">Where should we send your order?</p>
                            <form id="checkout-form" class="card form-card" novalidate>
                                <h3>Contact details</h3>
                                <div class="form-grid">
                                    <div class="field"><label for="checkout-name">Full name</label><input required
                                            id="checkout-name" name="name" placeholder="Enter your full name"
                                            autocomplete="name" data-checkout-rule="name"
                                            aria-describedby="checkout-name-error"><small class="field-error"
                                            id="checkout-name-error" aria-live="polite"></small></div>
                                    <div class="field"><label for="checkout-email">Email address</label><input required
                                            type="email" id="checkout-email" name="email" placeholder="you@example.com"
                                            autocomplete="email" data-checkout-rule="email"
                                            aria-describedby="checkout-email-error"><small class="field-error"
                                            id="checkout-email-error" aria-live="polite"></small>
                                    </div>
                                    <div class="field"><label for="checkout-phone">Phone number</label><input required
                                            id="checkout-phone" name="phone" placeholder="01XXXXXXXXX" autocomplete="tel"
                                            inputmode="numeric" maxlength="11" pattern="01[0-9]{9}"
                                            data-checkout-rule="phone" aria-describedby="checkout-phone-error"><small
                                            class="field-error" id="checkout-phone-error" aria-live="polite"></small></div>
                                    <div class="field"><label for="checkout-area">Delivery area</label><select required
                                            id="checkout-area" name="area" data-checkout-rule="required"
                                            aria-describedby="checkout-area-error">
                                            <option value="">Select area</option>
                                            <option>Dhaka</option>
                                            <option>Chattogram</option>
                                            <option>Khulna</option>
                                            <option>Rajshahi</option>
                                        </select><small class="field-error" id="checkout-area-error"
                                            aria-live="polite"></small></div>
                                    <div class="field full"><label for="checkout-address">Delivery address</label><input
                                            required id="checkout-address" name="address"
                                            placeholder="House, road, area and city" data-checkout-rule="required"
                                            aria-describedby="checkout-address-error"><small class="field-error"
                                            id="checkout-address-error" aria-live="polite"></small></div>
                                    <div class="field full"><label for="checkout-note">Delivery note
                                            (optional)</label><input id="checkout-note" name="note"
                                            placeholder="Instructions for the delivery person"></div>
                                </div>
                            </form>
                        </section>
                        <section class="payment-section">
                            <h2>Payment method</h2>
                            <p>Choose how you want to pay.</p><label class="payment-option"><input type="radio"
                                    value="Cash on Delivery" name="payment" checked> Cash on Delivery</label><label
                                class="payment-option"><input type="radio" value="bKash" name="payment">
                                bKash</label><label class="payment-option"><input type="radio"
                                    value="Credit / Debit Card" name="payment"> Credit / Debit Card</label>
                        </section>
                    </div>
                    <aside class="card checkout-summary" id="checkout-summary"></aside>
                </div>
            </div>
        </main>
    </div>
    <div class="notice" role="status"></div>
    <script src="customer.js"></script>
</body>

</html>
