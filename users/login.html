<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/salesmanstyle.css">
    <link rel="icon" href="../favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="../assets/salesmanscript.js"></script>
</head>
<body id="loginbody">
    <section id="loginleft">
        <div id="logoname">
            <img id="img" src="../images/favicon-32x32.png" alt="logo">
            <h3 id="loginname">GadgetHub</h3>
        </div>
        <div>
            <h1 id="fav">Your next favorite<br>
            <span id="bluespan">gadget is waiting.</span></h1>
            <p id="explorelogin">Explore trusted tech essentials with a shopping<br>experienced designed around you.</p>
        </div>
        <div>
            <div id="emptydiv"></div>
            <p id="loginfootp1">TECH THAT MOVES YOU</p>
            <p id="loginfootp2">Everyday essentials</p>
        </div>
    </section>

    <section id="loginright">
        <div id="whitecardmanage">
            <h2 id="cardtitlelogin">Welcome back</h2>
            <p id="cardtitleloginp">Sign in to continue to your GadgetHub account.</p>

            <form onsubmit="return formValidateLogin()" action="" method="post">
                <label class="emailpasslogin" for="email">Email</label>
                <input class="textpasslogin" type="text" id="email" placeholder="Enter your email">
                <span id="emailspan" style="color:red; font-weight:bold;"></span>
                <br>
                <label class="emailpasslogin" for="password">Password</label>
                <input class="textpasslogin" type="password" id="password" placeholder="Enter your password">
                <br>
                <input type="checkbox" id="remember">
                <label id="rememberme" for="remember">Remember me</label>
                <a href="" id="forgot">Forgot password?</a>
                <br>
                <input id="loginsubmit" type="submit" value="Sign in">
            </form>
            <p id="newto">New to GadgetHub?<br>
            <a id="createaccount" href="register.html">Create Account</a></p>
        </div>
    </section>
</body>
</html>
