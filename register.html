<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <section>
        <div>
            <img src="" title="logo" alt="logo">
            <h3>GadgetHub</h3>
        </div>
        <div>
            <h1>Your next favorite<br>
            <span>gadget is waiting.</span></h1>
            <p>Explore trusted tech essentials with a shopping<br>experienced designed around you.</p>
        </div>
        <div>
            <div></div>
            <p>TECH THAT MOVES YOU</p>
            <p>Everyday essentials</p>
        </div>
    </section>

    <section>
        <div>
            <h2>Create your account</h2>
            <p>Join GadgetHub for smarter shopping</p>

            <form>
                <label for="fname">Full name</label>
                <input type="text" id="fname" required>
                <br>
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
                <br>
                <label for="phone">Phone Number</label>
                <input type="number" id="phone" required> 
                <br>
                <label for="password">Password</label>
                <input type="password" id="password" required>
                <br>
                <label for="confirmpass">Confirm Password</label>
                <input type="password" id="confirmpass" required>
                <br>
                <input type="submit" value="Create account">
            </form>
            <p>Already have an account?
                    <a href="login.html">Sign in</a>
            </p>
        </div>
    </section>
</body>
</html>
